# 0.20 mm everyday profile for the Ender-3 V3 KE. Speeds/accels from Creality's official KE profile.
compatible_printers_condition = printer_notes=~/.*PRINTER_MODEL_ENDER3V3KE.*/ and nozzle_diameter[0]==0.4
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 4
top_solid_min_thickness = 0.8
fill_density = 15%
fill_pattern = gyroid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
infill_overlap = 25%
seam_position = aligned
elefant_foot_compensation = 0.05
skirts = 0
brim_width = 0
support_material = 0
support_material_auto = 1
support_material_threshold = 30
support_material_contact_distance = 0.16
support_material_interface_layers = 2
extrusion_width = 0.42
external_perimeter_extrusion_width = 0.42
perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.42
first_layer_extrusion_width = 0.5
support_material_extrusion_width = 0.42
external_perimeter_speed = 200
perimeter_speed = 300
infill_speed = 300
solid_infill_speed = 300
top_solid_infill_speed = 250
gap_fill_speed = 200
bridge_speed = 65
support_material_speed = 200
support_material_interface_speed = 100%
travel_speed = 400
first_layer_speed = 50
first_layer_infill_speed = 105
default_acceleration = 5000
external_perimeter_acceleration = 4000
perimeter_acceleration = 5000
infill_acceleration = 5000
solid_infill_acceleration = 5000
top_solid_infill_acceleration = 5000
bridge_acceleration = 5000
travel_acceleration = 5000
first_layer_acceleration = 1000
enable_dynamic_overhang_speeds = 1
output_filename_format = {input_filename_base}_{filament_type[0]}_{print_time}.gcode
