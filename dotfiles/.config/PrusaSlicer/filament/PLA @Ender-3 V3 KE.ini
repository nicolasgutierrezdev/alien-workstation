# Generic/Creality PLA on the Ender-3 V3 KE (Creality official values).
compatible_printers_condition = printer_notes=~/.*PRINTER_MODEL_ENDER3V3KE.*/
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 18
extrusion_multiplier = 0.95
filament_max_volumetric_speed = 18
temperature = 220
first_layer_temperature = 220
bed_temperature = 50
first_layer_bed_temperature = 50
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
fan_below_layer_time = 60
slowdown_below_layer_time = 5
min_print_speed = 10
start_filament_gcode = "; Filament gcode\nSET_PRESSURE_ADVANCE ADVANCE=0.048"
