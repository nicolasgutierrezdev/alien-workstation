# Generic/Creality PETG on the Ender-3 V3 KE (Creality official values).
compatible_printers_condition = printer_notes=~/.*PRINTER_MODEL_ENDER3V3KE.*/
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.23
filament_cost = 14
extrusion_multiplier = 0.95
filament_max_volumetric_speed = 9
temperature = 230
first_layer_temperature = 230
bed_temperature = 70
first_layer_bed_temperature = 70
cooling = 1
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 40
bridge_fan_speed = 90
disable_fan_first_layers = 3
fan_below_layer_time = 30
slowdown_below_layer_time = 8
min_print_speed = 10
start_filament_gcode = "; Filament gcode\nSET_PRESSURE_ADVANCE ADVANCE=0.08"
