# Creality Ender-3 V3 KE, 0.4 mm nozzle. Values from Creality's official KE profile.
printer_technology = FFF
printer_notes = PRINTER_VENDOR_CREALITY\nPRINTER_MODEL_ENDER3V3KE
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 245
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.32
gcode_flavor = klipper
use_relative_e_distances = 1
autoemit_temperature_commands = 0
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 8000,8000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 8000,8000
machine_max_acceleration_x = 8000,8000
machine_max_acceleration_y = 8000,8000
machine_max_acceleration_z = 300,300
machine_max_acceleration_e = 5000,5000
machine_max_feedrate_x = 500,500
machine_max_feedrate_y = 500,500
machine_max_feedrate_z = 30,30
machine_max_feedrate_e = 40,40
machine_max_jerk_x = 7,7
machine_max_jerk_y = 7,7
machine_max_jerk_z = 0.4,0.4
machine_max_jerk_e = 5,5
retract_length = 0.5
retract_speed = 30
deretract_speed = 0
retract_before_travel = 2
retract_lift = 0.2
retract_layer_change = 1
wipe = 1
retract_before_wipe = 100%
retract_length_toolchange = 1
color_change_gcode = M600
pause_print_gcode = PAUSE
thumbnails = 96x96/PNG, 300x300/PNG
start_gcode = SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan0_min VALUE=30 ;compensate for fan speed\nSET_VELOCITY_LIMIT ACCEL_TO_DECEL=2500\nM220 S100 ;reset feedrate\nM221 S100 ;reset flowrate\nM83 ;relative extrusion\n\nM140 S[first_layer_bed_temperature] ;set bed temp\nG28 X Y ;home XY\nM190 S[first_layer_bed_temperature] ;wait for bed\nG28 Z ;home Z and load bed mesh\nBED_MESH_CALIBRATE PROBE_COUNT=5,5 ;auto bed level\n\nM104 S[first_layer_temperature] ;set nozzle temp\nG92 E0\nG1 X-2.0 Y20 Z0.3 F5000.0 ;move to start\nM109 S[first_layer_temperature] ;wait for nozzle\nG1 Z0.2\nG1 Y145.0 F1500.0 E15 ;first purge line\nG1 X-1.7 F5000.0\nG1 Y30 F1500.0 E15 ;second purge line\nG92 E0
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0\n;[layer_z]
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
end_gcode = G92 E0\nG1 E-1.2 Z{max_layer_z + 0.5} F1800 ;retract and raise Z\n{if max_layer_z < 50}G1 Z{max_layer_z + 25} F900 ;raise more\n{endif}\nG1 X2 Y218 F3000 ;present print\nM106 S0 ;fan off\nM104 S0 ;hotend off\nM140 S0 ;bed off\nM84 X Y E ;steppers off except Z
