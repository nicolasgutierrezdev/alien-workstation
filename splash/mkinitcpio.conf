# Installed as /etc/mkinitcpio.conf.d/plymouth.conf by splash/install.sh.
# Adds the plymouth hook right after systemd (or udev), so the splash starts as
# early as possible, without editing the HOOKS line in /etc/mkinitcpio.conf.
read -ra _hooks <<<"${HOOKS[*]}"
if [[ " ${_hooks[*]} " != *" plymouth "* ]]; then
    HOOKS=()
    for _hook in "${_hooks[@]}"; do
        HOOKS+=("$_hook")
        if [[ $_hook == systemd || $_hook == udev ]]; then
            HOOKS+=(plymouth)
        fi
    done
fi
unset _hooks _hook
